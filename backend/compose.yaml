services:
  scanner:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "1"
    expose: ["8080"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    tmpfs: [/tmp]
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SCANNER_DOMAIN: ${SCANNER_DOMAIN:?Set SCANNER_DOMAIN in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
